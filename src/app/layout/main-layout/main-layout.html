<mat-sidenav-container class="h-dvh bg-surface-container-low" autosize>
    <mat-sidenav
        #drawer
        class="sidenav"
        mode="side" [(opened)]="opened" (opened)="trackEvent('open!')"
                (closed)="trackEvent('close!')"
    >
    <app-sidebar (navigate)="drawer.close()"></app-sidebar>
    </mat-sidenav>
    <mat-sidenav-content class="bg-surface-container-low">
        <app-topbar (toggleSidenav)="drawer.toggle()"></app-topbar>
        <main class="w-full mx-auto max-w-[1500px] p-4 md:p-6 lg:p-8">
            <router-outlet></router-outlet>    
        </main>
    </mat-sidenav-content>
</mat-sidenav-container>
