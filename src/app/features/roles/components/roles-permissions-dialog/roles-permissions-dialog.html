<h2 mat-dialog-title>permisos del rol</h2>
<mat-dialog-content>
  <div class="flex flex-wrap gap-2">
    @for(permissionId of data.permisosIds; track $index) {
      <mat-chip color="primary" selected>{{ permissionId }}</mat-chip>

    }
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Close</button>
</mat-dialog-actions>
